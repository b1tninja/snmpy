version: 2
updates:
  # Keep the CI/release workflow pins current (checkout, setup-python,
  # upload/download-artifact, attest, pypi-publish).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # Build/lint/test tooling comes from the `dev` extra in pyproject.toml.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-tools:
        patterns:
          - "*"
    cooldown:
      default-days: 7
