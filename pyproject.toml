[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "snmpy"
dynamic = ["version"]
description = "A Python3 SNMP library built with asyncio"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["snmp", "snmpv3", "asyncio", "monitoring", "networking", "ber", "asn1"]
requires-python = ">=3.12"
authors = [
    {name = "snmpy Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/b1tninja/snmpy"
Repository = "https://github.com/b1tninja/snmpy"
Issues = "https://github.com/b1tninja/snmpy/issues"

[project.optional-dependencies]
crypto = [
    "cryptography>=42.0.0",
]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
]
examples = [
    "psutil>=6.0.0",
]

[project.scripts]
snmpy = "snmpy:main"

[tool.setuptools.dynamic]
version = {attr = "snmpy.__version__"}

[tool.setuptools.packages.find]
include = ["snmp*", "ber*", "masscan*"]

# PEP 561 markers plus the hand-written stubs in snmp/.
[tool.setuptools.package-data]
"*" = ["py.typed"]
snmp = ["*.pyi"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["snmp", "ber", "masscan"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
files = ["snmp", "ber", "snmpy", "masscan"]

[tool.pytest.ini_options]
testpaths = ["snmp", "ber", "snmpy", "masscan"]